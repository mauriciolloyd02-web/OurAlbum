
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Album</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(70, 120, 255, 0.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(180, 80, 255, 0.25),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #090b24,
                    #101b4d,
                    #17102f
                );

            padding: 50px 20px;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        .circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: -2;
        }

        .circle1 {
            width: 300px;
            height: 300px;
            background: #267cff;
            top: 5%;
            left: 5%;
        }

        .circle2 {
            width: 350px;
            height: 350px;
            background: #9b35ff;
            bottom: 5%;
            right: 5%;
        }


        /* =========================
           BUTTERFLIES
        ========================= */

        .butterfly {
            position: fixed;
            font-size: 30px;
            color: #4da6ff;
            z-index: -1;
            pointer-events: none;

            filter:
                drop-shadow(0 0 8px #2196ff)
                drop-shadow(0 0 15px rgba(33, 150, 255, 0.8));

            animation:
                fly 15s linear infinite,
                flutter 1.2s ease-in-out infinite alternate;
        }

        .butterfly:nth-child(1) {
            top: 20%;
            left: -50px;
            font-size: 28px;
            animation-duration: 18s, 1s;
            animation-delay: 0s, 0s;
        }

        .butterfly:nth-child(2) {
            top: 60%;
            left: -50px;
            font-size: 22px;
            animation-duration: 22s, 1.3s;
            animation-delay: 3s, 0.3s;
        }

        .butterfly:nth-child(3) {
            top: 35%;
            left: -50px;
            font-size: 35px;
            animation-duration: 20s, 0.9s;
            animation-delay: 6s, 0.2s;
        }

        .butterfly:nth-child(4) {
            top: 80%;
            left: -50px;
            font-size: 25px;
            animation-duration: 25s, 1.5s;
            animation-delay: 2s, 0.5s;
        }

        .butterfly:nth-child(5) {
            top: 10%;
            left: -50px;
            font-size: 20px;
            animation-duration: 19s, 1.1s;
            animation-delay: 9s, 0.4s;
        }


        @keyframes fly {

            0% {
                transform: translateX(-80px)
                           translateY(0)
                           rotate(-10deg);
            }

            20% {
                transform: translateX(20vw)
                           translateY(-50px)
                           rotate(10deg);
            }

            40% {
                transform: translateX(40vw)
                           translateY(40px)
                           rotate(-5deg);
            }

            60% {
                transform: translateX(60vw)
                           translateY(-60px)
                           rotate(10deg);
            }

            80% {
                transform: translateX(80vw)
                           translateY(30px)
                           rotate(-10deg);
            }

            100% {
                transform: translateX(110vw)
                           translateY(-20px)
                           rotate(5deg);
            }
        }


        @keyframes flutter {

            0% {
                scale: 1 0.8;
            }

            100% {
                scale: 1 1.1;
            }
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .container {
            max-width: 1100px;
            margin: auto;
            text-align: center;
            position: relative;
            z-index: 2;
        }


        h1 {
            font-size: 45px;
            margin-bottom: 10px;

            text-shadow:
                0 0 10px rgba(255,255,255,0.5),
                0 0 25px rgba(80,150,255,0.7);
        }


        .subtitle {
            font-size: 17px;
            opacity: 0.8;
            margin-bottom: 35px;
        }


        /* =========================
           ALBUM GRID
        ========================= */

        .album {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 25px;
        }


        /* =========================
           PHOTO CARD
        ========================= */

        .photo {

            height: 300px;

            border-radius: 20px;

            overflow: hidden;

            background: rgba(255,255,255,0.1);

            border:
                2px solid rgba(255,255,255,0.2);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35);

            backdrop-filter: blur(10px);

            cursor: pointer;

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }


        .photo:hover {

            transform: scale(1.05);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.5),
                0 0 30px rgba(50,150,255,0.35);
        }


        .photo img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           ZOOM / LIGHTBOX
        ========================= */

        .lightbox {

            display: none;

            position: fixed;

            z-index: 9999;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.9);

            justify-content: center;
            align-items: center;

            padding: 40px;
        }


        .lightbox.active {

            display: flex;
        }


        .lightbox img {

            max-width: 90%;
            max-height: 90%;

            object-fit: contain;

            border-radius: 15px;

            box-shadow:
                0 0 40px rgba(255,255,255,0.2);

            animation: zoomIn 0.3s ease;
        }


        @keyframes zoomIn {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close {

            position: absolute;

            top: 20px;
            right: 35px;

            font-size: 45px;

            color: white;

            cursor: pointer;

            line-height: 1;

            transition: 0.3s;
        }


        .close:hover {

            color: #4da6ff;

            transform: rotate(90deg);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 32px;
            }

            .photo {
                height: 250px;
            }

            .photo:hover {
                transform: scale(1.03);
            }

            .lightbox {
                padding: 20px;
            }

            .lightbox img {
                max-width: 95%;
                max-height: 85%;
            }

            .close {
                top: 15px;
                right: 20px;
                font-size: 40px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         BACKGROUND GLOW
    ========================= -->

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>


    <!-- =========================
         BLUE BUTTERFLIES
    ========================= -->

    <div class="butterfly">🦋</div>
    <div class="butterfly">🦋</div>
    <div class="butterfly">🦋</div>
    <div class="butterfly">🦋</div>
    <div class="butterfly">🦋</div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">

        <h1>Album</h1>

        <p class="subtitle">
            Memories captured through the years
        </p>


        <!-- =========================
             PHOTO ALBUM
        ========================= -->

        <div class="album">


            <!-- PHOTO 1 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/2023-1.jpg">

            </div>


            <!-- PHOTO 2 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/2023-2.jpg">

            </div>


            <!-- PHOTO 3 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/2023-3.jpg">

            </div>


            <!-- PHOTO 4 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/2023-4.jpg">

            </div>


            <!-- PHOTO 5 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/1.jpg">

            </div>


            <!-- PHOTO 6 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/2.jpg">

            </div>


            <!-- PHOTO 7 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/3.jpg">

            </div>


            <!-- PHOTO 8 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/4.jpg">

            </div>


            <!-- PHOTO 9 -->

            <div class="photo" onclick="openImage(this)">

            <!-- PHOTO 10 -->

            <div class="photo" onclick="openImage(this)">

                <img src="images/6.jpg">

            </div>


            <!-- PHOTO 11 -->

    
        </div>

    </div>



    <!-- =========================
         ZOOM / LIGHTBOX
    ========================= -->

    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeImage()">
            &times;
        </span>

        <img id="zoomedImage">

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function openImage(photo) {

            const image =
                photo.querySelector("img");

            const lightbox =
                document.getElementById("lightbox");

            const zoomedImage =
                document.getElementById("zoomedImage");


            zoomedImage.src = image.src;

            lightbox.classList.add("active");

        }


        function closeImage() {

            const lightbox =
                document.getElementById("lightbox");

            lightbox.classList.remove("active");

        }


        /* Close when clicking outside the image */

        document
            .getElementById("lightbox")
            .addEventListener("click", function(event) {

                if (event.target === this) {

                    closeImage();

                }

            });


        /* Close using ESC key */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                closeImage();

            }

        });

    </script>

</body>

</html>
